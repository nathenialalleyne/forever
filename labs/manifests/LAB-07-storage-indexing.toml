# This lab uses the fixed baseline from pack/ and tests three additional 26.2 Fabric
# candidates. The baseline is repeated so the lab can be reproduced independently.
#
# Modrinth metadata was queried on 2026-08-28. Candidate SHA-1/SHA-512 values below
# are the hashes returned by the version endpoint and were matched after download.
# Local SHA-256 values are included as an additional acquisition record.

