[not_added]
simple_storage_network = "Modrinth project cVIr8Vz1 has no version returned by the exact 26.2 Fabric query. Its newest observed release is YznUL5Pm, 26.1.2-1.13.2, NeoForge, storagenetwork-26.1.2-1.13.2.jar, published 2026-08-23. The project licence is LicenseRef-All-Rights-Reserved."
sophisticated_storage = "Modrinth project hMlaZH8f has no version returned by the exact 26.2 Fabric query. A 26.2 release does exist, EVA2q8Zy 26.2-1.5.113.2122, but it is NeoForge-only and LicenseRef-All-Rights-Reserved."
functional_storage = "Modrinth project cO40ZIg3 has no 26.2 release. The newest observed entry is nSI7DQsa, 26.1-1.6.1 for 26.1.2 NeoForge, and it is a beta release."
expanded_storage = "The exact Modrinth project slugs expanded-storage and expandedstorage returned 404, and the exact-title search returned only unrelated addons or modpacks. No direct Modrinth candidate was available to pin or test."
sophisticated_storage_fabric_port = "The unofficial Fabric project iHtpVwJL has no 26.2 Fabric version. Its newest observed release is xezSXA8y, 1.20.1-1.3.5.11.142."
easy_storage = "The 26.2 Fabric release TmGfMDmE exists, but the official project description advertises no fixed chest limit and direct insert/extract through one display. The project exposes no source_url in its API metadata, so it fails the bounded local-source contract without a separate review."
upgraded_iron_chests = "The 26.2 release vV2zgK02 exists, but the project is LicenseRef-All-Rights-Reserved, exposes no source_url, and advertises global search over linked chests. It is not suitable for the default pack baseline."
linked_chests = "The 26.2.1 release 5oJWzvLd explicitly advertises access to the same inventory from any chest, any place, any time. This is the universal wireless/shared-inventory behaviour rejected by ADR 0012."
portable_storage = "The 26.2 release bAwTVe47 explicitly provides a portable warehouse with infinite stacking. Its project page also warns that AI wrote 99.99 percent of the code and design. This conflicts with ADR 0011 and the save-safety bar."
infinite_shulker_box = "The 26.2 release ZfmgcHIb explicitly allows an infinite amount of Shulker Boxes inside one Shulker Box. This is a direct container-nesting violation."
compact_storage = "The 26.2 release mehMI8pF provides upgradable chests, barrels, and backpacks but no local search/index contract. Its portable backpack surface needs a separate ADR 0011 review."

[not_tested]
storage_tracker = "The 26.2 release EaRyTxXR is MIT and client-only/server-unsupported. It records client-side snapshots and advertises nested shulker indexing. No client can be launched in this environment."
storage_finder = "The 26.2 release PReIxUWo is MIT and client-only/server-unsupported. It remembers previously opened containers and highlights local targets. No client can be launched in this environment."
chest_tracker_port = "The 26.2 release cwtdCpdg is an unofficial LGPL client-only port. It can search remembered storage on multiplayer servers, but it cannot provide server-authoritative state. No client can be launched in this environment."
invsearch = "The 26.2 release 5B8rNxhp is client-only, LicenseRef-All-Rights-Reserved, and includes an embedded web dashboard. No client can be launched in this environment."
client_ui_for_tested_candidates = "Tom's terminal UI, Storage Drawers controller UI, and StorageGuide's grid creation, assignment, highlights, paging, and non-operator views were not exercised because the host has no usable display."
multiplayer_player_flow = "No real player connection was available. Server-side authority and permission paths were inspected in source for StorageGuide, while dedicated-server startup was exercised for all three added candidates."
