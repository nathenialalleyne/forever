[not_added]
create_rail = "Create and Create Fabric had no usable exact Fabric 26.2 release in the Modrinth version query. Create is Forge/NeoForge-oriented, and the official project uses LicenseRef-Create-Mod-License."
extended_rails = "No exact verified Fabric 26.2 release was returned for Extended Rails by the Modrinth API search/version review. No substitute was tested."
immersive_aircraft = "No exact verified Fabric 26.2 release was returned for Immersive Aircraft by the Modrinth API search/version review. No substitute was tested."
better_boat_movement = "The observed Better Boat Movement candidate was labeled for 26.1 rather than an exact verified 26.2 Fabric release. No substitute was tested."
icy_better_horses = "Icy's Better Horses has an exact 26.2 Fabric release, but its advertised roster and beyond-range whistle behavior imply global or teleport-like horse access rather than a local physical service."
copper_rails = "Copper Rails has an exact 26.2 Fabric release, but the inspected project is rail variants and physics only and exposes no station or freight endpoint."
roads_n_vehicles = "Roads 'n' Vehicles has an exact 26.2 Fabric release, but the inspected project is a small decor and ride surface and exposes no station or freight endpoint."
create_fly_steam_n_rails = "Steam 'n' Rails Continued has an exact 26.2 Fabric release, but its required Create Fly release is named 26.2-rc-2 and there is no clean stable 26.2 dependency stack to test. No substitute was invented."
tesseract = "LAB-08 found an exact 26.2 Fabric release, but Tesseract advertises any-distance and cross-dimensional item transport. That contradicts ADR 0012 without an explicit physical depot."
hopper_plus = "LAB-08 found an exact 26.2 Fabric release, but Hopper Plus explicitly advertises teleporting items across distances. That contradicts ADR 0012."
vanilla_modes = "Walking, horses, boats, rails, chest minecarts, and Elytra are not downloadable candidates. They remain the ordinary baseline."

[not_tested]
station_endpoints = "No tested candidate exposed a bounded station, depot, or route-registration API suitable for explicit Forever registration. Minecart Trains Fork only exposed pairwise cart linkage."
freight_service = "No candidate exposed a durable source, cargo, buffer, destination, capacity, service, and exactly-once freight contract. Vanilla chest-minecart cargo was tested as an ordinary inventory only."
chunk_unload = "A full in-transit chunk-unload matrix was not run. Controlled instances used force-loaded chunks for repeatability, so no candidate is credited with safe unloaded transit."
route_damage = "No candidate had a registered route to damage. Disconnected-track and broken-service behavior therefore remains a route-adapter follow-up."
client_visual_review = "Automobility and Minecart Trains Fork reached the client with OpenGL and texture-atlas evidence, but screenshots were black and no human visual inspection or interactive controls were performed."
multiplayer = "No real player connection was available. Permissions, multiplayer desync, and per-player vehicle ownership were not tested."
server_profiling = "No tick profiler or sustained route benchmark was run. Startup timings are observations only and do not establish a performance bound."
