[not_tested]
fabric_seasons = "Project KJe6y9Eu (Fabric Seasons), latest observed release was 2.4.2-BETA+1.21.1, version 2mIvRTNp, published 2024-10-06T21:50:06.435974Z. The exact Modrinth filter for game_versions=26.2 and loaders=fabric returned no versions, so no incompatible build was tested. DEFER."
seasonal_visuals = "Project xhy3SoOP (Seasonal Visuals), version ZqYQldzl, file seasonal-visuals-0.1.0.jar, is an alpha visual-atmosphere provider published 2026-07-29T03:58:20.193789Z. It does not provide crop, local-temperature, greenhouse, or weather semantics required by ADR 0014. Not tested."
season_hud = "Project iDiIfZLX (SeasonHud-Fabric), version JyxCRQwH, file seasonhud-fabric-26.2-2.0.8.jar, is a release overlay published 2026-08-01T02:28:25.385773Z, not a climate provider. It cannot supply the provider contract. Not tested."
natural_temperature = "Project QZt2fevq (Natural Temperature), version YxkQTe0m, file natural-temperature-1.1.10-FABRIC-MC-26.2.jar, is a release published 2026-08-15T17:12:16.024412Z. It changes biome placement and climate zones during world generation rather than providing a seasonal calendar. Not tested because it is outside this spike and would add worldgen migration risk."
crops_love_rain = "Project cRci7UZp (Crops Love Rain), version YzNJMQVQ, file cropsloverain-3.2.1.jar, release published 2026-03-25T19:02:33.154075Z. Its description only provides rain-based crop growth acceleration, not a calendar, local profile, forecast, or mitigation contract. Not tested."
tough_as_nails = "Project ge1sOdFH (Tough As Nails), version bZ9oibj4, file ToughAsNails-fabric-26.2-21.11.0.8.jar, beta published 2026-07-28T11:15:14.990537Z. It supplies body temperature and thirst, which overlaps Matcha's food, hunger, and healing space, and it is not a seasons provider. Not tested."
other_search_results = "Modrinth searches for season, seasons, climate, weather, temperature, and crop with facets project_type=mod, categories=fabric, and versions=26.2 were inspected on 2026-08-28. Utility, visual-only, crop-rain, fishing, worldgen, weather-only, and body-temperature results were not treated as full seasonal providers. No additional maintained 26.2 Fabric provider was selected for boot testing."

[not_added]
homeostatic_body_module = "Project oDobngty (Homeostatic), version IQrivzqu, file homeostatic-26.2-fabric-2.13.0.1.jar, release published 2026-06-28T14:07:51.624896Z. Homeostatic Seasons documents this as optional, but it adds body temperature and thirst that overlap Matcha's food, hunger, healing, and food-effect ownership. Not added."
pack = "No candidate was added to pack/. ADR 0014 requires the pack-facing climate abstraction to remain provider-neutral, and the strongest candidate still lacks crop and greenhouse evidence."
beta_as_core = "Serene Seasons 13sXhUkI and its required GlitchCore SDUCBYRU are beta builds. They were tested only as compatibility evidence and are not eligible as core dependencies."
vanilla_weather = "Vanilla weather remains the no-provider fallback. It was not added as a separate dependency because it is already part of Minecraft."
