structurize = "The official Structurize project at https://github.com/ldtteam/Structurize is GPL-3.0, but no verified Modrinth 26.2 Fabric artifact was returned. The Modrinth project and version lookups did not provide a compatible release, so no substitute was invented."
litematica_printer = "project_id=3llatzyE, version_id=7l7ihnI0, file=litematica-printer-26.2-3.2.2.jar, AGPL-3.0-only; explicitly adds missing printing functionality and conflicts with the no-creative-printing scope."
schematic_placer = "project_id=uQVTjOl4, version_id=esbnGUqT, file=schematic-placer-1.0.4.jar, MIT; WorldEdit addon whose purpose is placing schematics over ticks, so it is a printing tool rather than Ghost Plan."
litematica_server_paster = "project_id=HCbarMw6; no 26.2 Fabric release was returned. The project description is server pasting of block and entity data, which is outside the preview-only scope even if a compatible release appears later."
portable_blueprints = "project_id=pTRNOhPP; no 26.2 Fabric release was returned. Its description promises one-click instant rebuilding, which would also require a separate survival-authority review."
building_blueprint = "project_id=AmLpMiSO; no 26.2 Fabric release was returned. The project is All Rights Reserved and advertises saving and placing structures, so no unverified substitute was used."
schematica_reloaded = "project_id=eJObCFt0; no 26.2 Fabric release was returned. The observed releases target older Minecraft versions."
