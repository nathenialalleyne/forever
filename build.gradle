plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

repositories {
	mavenCentral()
}

loom {
	// Split common/client source sets. Common code must never reference client
	// classes; see docs/architecture.md and AGENTS.md.
	splitEnvironmentSourceSets()

	mods {
		"forever" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// GameTest source set. Kept separate so gameplay test scaffolding never ships
// in the production JAR. See docs/development-workflow.md.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

loom {
	runs {
		gametest {
			server()
			name = "GameTest"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
		}

		// Datagen scaffold. Forever generates no content yet (no items, blocks,
		// recipes, or tags exist), so this run produces an empty output tree. It is
		// configured now so that the first content ticket does not also have to
		// design the data-generation pipeline. See docs/development-workflow.md.
		datagen {
			server()
			name = "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=forever"
			runDir "build/datagen"
		}
	}
}

// The datagen entrypoint is registered in fabric.mod.json only when a generator
// exists. Until then the run configuration above is a validated scaffold.

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit unit tests for logic that does not need a Minecraft runtime.
	// The GameTest source set needs the Fabric API and Minecraft on its compile
	// classpath. It is intentionally NOT part of the shipped JAR.
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

tasks.withType(Javadoc).configureEach {
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
