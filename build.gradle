plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'checkstyle'
}

version = project.version
group = project.group

repositories {
	mavenCentral()
}

// Checkstyle is a build-time quality gate, not a runtime dependency. Pinning its
// Maven Central tool version keeps lint results reproducible across developers and CI.
checkstyle {
	toolVersion = project.checkstyle_version
	configDirectory = layout.projectDirectory.dir("config/checkstyle")
}

loom {
	// Split common/client source sets. Common code must never reference client
	// classes; see docs/architecture.md and AGENTS.md.
	splitEnvironmentSourceSets()

	mods {
		"forever" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// GameTest source set. Kept separate so gameplay test scaffolding never ships
// in the production JAR. See docs/development-workflow.md.
sourceSets {
	// Keep the developer-only validator out of Loom's production mod source sets and
	// therefore out of the shipped JAR. It has no Minecraft or third-party dependency.
	assetTools {
		java.srcDir("src/assetTools/java")
	}

	gametest {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}

	// MRH-013's diagnostic candidate is deliberately a separate source set. It shares
	// the pinned compile/runtime APIs for convenience but is never attached to the
	// existing "forever" mod or its production JAR.
	diagnostic {
		java.srcDir("src/diagnostic/java")
		resources.srcDir("src/diagnostic/resources")
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}

	// The fixture is packaged separately from both the candidate and the root
	// prototype. It exists only for an isolated dedicated-server GameTest run.
	diagnosticGameTest {
		java.srcDir("src/diagnosticGameTest/java")
		resources.srcDir("src/diagnosticGameTest/resources")
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.diagnostic.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.diagnostic.output
	}
}

// Generate the candidate's immutable identity resource from the committed Matcha lock.
// This is deterministic and keeps the runtime check tied to the same lock that governs
// the pack, without reading repository files from a running server.
def diagnosticProfileFile = layout.buildDirectory.file("generated/diagnostic-resources/matcha-diagnostic.properties")
tasks.register("generateDiagnosticProfile") {
	inputs.file(layout.projectDirectory.file("matcha.lock.json"))
	outputs.file(diagnosticProfileFile)
	doLast {
		def lock = new groovy.json.JsonSlurper().parse(layout.projectDirectory.file("matcha.lock.json").asFile)
		def artifact = lock.artifact
		def filename = lock.filename as String
		def hash = lock.sha256 as String
		def version = lock.version_number as String
		def size = artifact.size as Long
		if (filename != artifact.filename || hash != artifact.sha256 || size != artifact.size
				|| !(hash ==~ /[0-9a-f]{64}/) || size <= 0L || version == null || version.isBlank()) {
			throw new GradleException("matcha.lock.json has inconsistent or invalid artifact identity")
		}
		def maxBytes = Math.min(Math.max(size * 2L, size + 1_048_576L), 64L * 1024L * 1024L)
		def output = diagnosticProfileFile.get().asFile
		output.parentFile.mkdirs()
		output.setText("""# Generated from matcha.lock.json. Do not edit by hand.
archive_filename=${filename}
archive_sha256=${hash}
archive_size=${size}
max_archive_bytes=${maxBytes}
version=${version}
pack_min_format=88.0
pack_max_format=107.1
pack_description=Klei's Matcha Flavoured ${version} for 26.2
""", "UTF-8")
	}
}

tasks.named("processDiagnosticResources") {
	dependsOn(tasks.named("generateDiagnosticProfile"))
	inputs.property("version", project.version)
	from(diagnosticProfileFile.map { it.asFile.parentFile })
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.named("processDiagnosticGameTestResources") {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("diagnosticJar", Jar) {
	dependsOn(tasks.named("diagnosticClasses"))
	archiveBaseName.set("forever-matcha-diagnostic")
	archiveVersion.set(project.version.toString())
	destinationDirectory.set(layout.buildDirectory.dir("diagnostic-libs"))
	from(sourceSets.diagnostic.output)
	from("LICENSE") {
		into("META-INF")
		rename { "LICENSE-Forever" }
	}
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.register("diagnosticGameTestJar", Jar) {
	dependsOn(tasks.named("diagnosticGameTestClasses"))
	archiveBaseName.set("forever-matcha-diagnostic-gametest")
	archiveVersion.set(project.version.toString())
	destinationDirectory.set(layout.buildDirectory.dir("diagnostic-libs"))
	from(sourceSets.diagnosticGameTest.output)
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

loom {
	runs {
		gametest {
			server()
			name = "GameTest"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
		}

		// Datagen scaffold. Forever generates no content yet (no items, blocks,
		// recipes, or tags exist), so this run produces an empty output tree. It is
		// configured now so that the first content ticket does not also have to
		// design the data-generation pipeline. See docs/development-workflow.md.
		datagen {
			server()
			name = "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=forever"
			runDir "build/datagen"
		}
	}
}

// The datagen entrypoint is registered in fabric.mod.json only when a generator
// exists. Until then the run configuration above is a validated scaffold.

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit unit tests for logic that does not need a Minecraft runtime.
	// The GameTest source set needs the Fabric API and Minecraft on its compile
	// classpath. It is intentionally NOT part of the shipped JAR.
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// ArchUnit keeps the documented package boundaries executable without adding
	// anything to the runtime mod or shipped JAR.
	testImplementation "com.tngtech.archunit:archunit-junit5:${project.archunit_version}"
	testImplementation files(
			sourceSets.assetTools.output,
			sourceSets.assetTools.compileClasspath,
			sourceSets.diagnostic.output)
}

tasks.named("compileTestJava") {
	dependsOn(tasks.named("diagnosticClasses"))
}

tasks.named("test") {
	dependsOn(tasks.named("diagnosticClasses"))
}

tasks.register("validateAssets", JavaExec) {
	group = "verification"
	description = "Validate the repository's Forever PNG assets against the asset manifest."
	dependsOn(tasks.named("assetToolsClasses"))
	classpath = sourceSets.assetTools.runtimeClasspath
	mainClass.set("dev.forever.tools.assets.AssetValidatorApplication")
	args(
			"--assets", layout.projectDirectory.dir("src/client/resources/assets/forever").asFile.absolutePath,
			"--manifest", layout.projectDirectory.file("docs/assets/asset-manifest.csv").asFile.absolutePath
	)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

tasks.withType(Javadoc).configureEach {
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// The built-in plugin creates checkstyleMain and checkstyleTest automatically. It also
// observes the custom source sets above, so client, GameTest, and asset-tool Java are
// checked without copying source-set logic into a second lint implementation.
tasks.withType(Checkstyle).configureEach {
	configFile = layout.projectDirectory.file("config/checkstyle/checkstyle.xml").asFile
	// SuppressionFilter references this file from XML, but Gradle cannot infer that
	// indirect input. Declaring it explicitly prevents a stale green report after a
	// suppression is added or removed.
	inputs.file(layout.projectDirectory.file("config/checkstyle/suppressions.xml"))
	// The common and server source sets peak at complexity 25. The standalone asset
	// validator contains an intentionally dense RFC 4180 parser at 29, so its task gets
	// a separate bound instead of weakening the production threshold for every source set.
	configProperties = [cyclomatic_max: name == "checkstyleAssetTools" ? "29" : "25"]
	// All active checks are blocking after the current-tree high-water marks were
	// established. A future breach therefore fails the normal Gradle check lifecycle.
	ignoreFailures = false
	reports {
		xml.required = true
		html.required = false
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
