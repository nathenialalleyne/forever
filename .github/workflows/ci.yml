name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  root-build:
    name: Root mod build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle owns the Gradle cache and applies safe, action-managed cache
      # behaviour. Do not add a hand-written cache of mutable Gradle state here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Matcha is deliberately not fetched in CI. Fetching it adds a network
      # dependency, introduces licensed third-party material into the job, and makes
      # the build less deterministic. Matcha acquisition is a pinned developer step.
      # `build` runs `check`, which runs the JUnit `test` task, so this single
      # invocation covers compilation, the client/common split, and unit tests.
      # A separate `test` job would duplicate the same work for no extra signal.
      #
      # Not run in CI: `runGametest` needs a full Minecraft server and asset
      # download, and `runClient` needs a display. Both are documented as local
      # smoke tests in README.md and docs/development-workflow.md.
      - name: Build root mod and run unit tests
        run: ./gradlew build --no-daemon

      - name: Upload root test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  audit-tool-tests:
    name: Matcha audit-tool tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is a separate Gradle build. The audit tool owns its own wrapper and is
      # intentionally not an included build or dependency of the mod.
      # Matcha is not downloaded here for network, licensing, and determinism reasons.
      - name: Run audit-tool tests
        working-directory: tools/matcha-audit
        run: ./gradlew test --no-daemon

      - name: Upload audit-tool reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matcha-audit-test-reports
          path: |
            tools/matcha-audit/build/reports/tests/
            tools/matcha-audit/build/test-results/
          if-no-files-found: ignore
