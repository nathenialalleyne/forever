# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache.
# See: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties. Pinned deliberately; see docs/dependency-baseline.md.
# Do NOT float these versions. Do NOT auto-update.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod properties
version=0.0.0-dev
group=dev.forever

# Dependencies
fabric_api_version=0.158.0+26.2

# Test dependencies (pinned)
junit_version=5.14.2

# Checkstyle tool (pinned). Maven Central: com.puppycrawl.tools:checkstyle.
# Required so source-quality checks run consistently in every build.
checkstyle_version=14.0.0
# ArchUnit makes the intended package and source-set boundaries executable in CI,
# so architectural regressions fail before a later gameplay change depends on them.
archunit_version=1.5.0
