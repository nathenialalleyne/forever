# Global Packs configuration for Many Roads Home.
#
# Why this file exists. The official Matcha Flavoured archive is a single zip that
# contains BOTH assets/ and data/ with one pack.mcmeta, so it must be loaded as a
# resource pack and as a datapack from the same file. Global Packs is currently the
# only pack-loading utility with a verified Minecraft 26.2 Fabric release, so it is
# what makes Matcha apply to every newly created world without the player enabling
# it by hand.
#
# Placement. Packwiz writes the archive to <instance>/datapacks/Matcha_Flavoured_1_12.zip.
# Both lists below therefore point at that same path. Global Packs resolves entries
# relative to the instance folder.
#
# Expected benign error. Because the archive already sits in the folder Global Packs
# copies into, startup logs two lines of:
#     ERROR: java.nio.file.FileAlreadyExistsException: ./datapacks/Matcha_Flavoured_1_12.zip
# immediately followed by "Found new data pack Matcha_Flavoured_1_12.zip, loading it
# automatically". The copy is redundant, not failed: the pack loads and the 2346-recipe
# and 1805-advancement baseline is preserved. One line appears per role, resource pack
# and datapack. This is logged at ERROR by the mod but is not a fault, and it predates
# any Many Roads Home change. Do not "fix" it by moving the archive out of datapacks/,
# which would break the packwiz datapack-folder contract in .config-packwiz.toml.
#
# Load order. MEASURED, not assumed. LAB-02 listed a probe pack before Matcha and the
# probe WON: the resulting level.dat order was Matcha then probe, and the recipe count
# changed, which means Minecraft applied the later pack over the earlier one. So the
# FIRST entry here is the LOWEST applied priority, the opposite of what the Global Packs
# changelog wording suggests.
#
# Matcha is therefore listed first on purpose: it is the gameplay foundation and should
# be overridden by later entries, not override them. Any Many Roads Home pack meant to
# change part of Matcha must be added AFTER this entry. See
# labs/results/LAB-02-pack-loader-dual-role.md.
# Must match the version the installed Global Packs build expects. A 26.2.0 server
# rewrote a hand-written 3 to 4 on first launch, so this is pinned to 4 to avoid a
# needless migration write on every fresh instance. Re-check this when the mod updates.
config_version = 4

# Keep this false. A user-global folder outside the instance would leak pack content
# between unrelated instances and make a test result irreproducible.
enable_system_global_packs = false

# Turn this on temporarily when verifying that Matcha is actually detected. It prints
# pack IDs to the log, which is the evidence a lab result should quote.
log_pack_ids = false

[resourcepacks]
required = [
    "datapacks/Matcha_Flavoured_1_12.zip"
]
enable_builtin = []

[datapacks]
required = [
    "datapacks/Matcha_Flavoured_1_12.zip"
]
optional = []
# Present in the 26.2.0 generated config. Declared here so the shipped file matches
# what the mod actually writes, rather than drifting from it on first launch.
enable_builtin = []
